# Dossier — Nginx site config.
# Include this file inside the `http {}` block (it declares a limit_req_zone):
#   include /etc/nginx/conf.d/dossier.conf;
# The app must never be reachable directly from the internet; compose binds it
# to 127.0.0.1:3000 only.

limit_req_zone $binary_remote_addr zone=dossier_public:10m rate=30r/m;

# HTTP → HTTPS redirect.
server {
  listen 80;
  listen [::]:80;
  server_name dossier.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dossier.example.com;

  # Certificates are managed by your cert tooling (e.g. certbot).
  ssl_certificate     /etc/nginx/certs/dossier.crt;
  ssl_certificate_key /etc/nginx/certs/dossier.key;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 12m;

  # Public signing + verification routes get rate limiting.
  location ~ ^/(s|v)/ {
    limit_req zone=dossier_public burst=20 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/dossier-proxy.conf;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/dossier-proxy.conf;
  }
}
