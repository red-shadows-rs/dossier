# ─────────────────────────────────────────────
# Dossier - Nginx Configuration
# ─────────────────────────────────────────────

# ── Rate Limiting ──
limit_req_zone $binary_remote_addr zone=dossier_public:10m rate=30r/m;

# ── HTTP Redirect ──
server {
  listen 80;
  listen [::]:80;
  server_name dossier.example.com;
  return 301 https://$host$request_uri;
}

# ── HTTPS Server ──
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name dossier.example.com;

  ssl_certificate     /etc/nginx/certs/dossier.crt;
  ssl_certificate_key /etc/nginx/certs/dossier.key;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 12m;

  location ~ ^/(s|v)/ {
    limit_req zone=dossier_public burst=20 nodelay;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/dossier-proxy.conf;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/dossier-proxy.conf;
  }
}
